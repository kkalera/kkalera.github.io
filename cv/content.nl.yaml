        YOLOv11-modellen voor detectie en segmentatie trainen daarop — de perceptielaag waar
        geautomatiseerde kraansturing op steunt en die encoderdata niet kan leveren.
      tech: Unity3D · YOLOv11 · PyTorch · synthetische data

    - title: RL Kaaikraan & Spreaderskew
      client: Eigen R&D
      status: "2021"
      stat: ~95%
      meter: 0.95
      result: van de taken van een kraanbestuurder overgenomen door een RL-agent.
      desc: >-
        Een zelfgebouwde Unity3D-simulator en ML-Agents-omgeving die onderzoekt of
        reinforcement learning het gedrag van een kraanbestuurder kan overnemen — inclusief
        een skewregelaar die de uitdemptijd van de spreader terugbracht van 27 s naar 6 s.
      tech: Unity3D · ML-Agents · PPO · SAC


      desc: >-
        Verbindt een legacy TOS via een API met ML-pipelines, zodat modelgestuurde
        beslissingen automatisch draaien met volledige terugval naar manueel — planners
        schuiven op van routinewerk naar uitzonderingsbeheer.
      tech: Python · C# · REST-API's · event-driven

    - title: Point-in-Time Datareconstructie

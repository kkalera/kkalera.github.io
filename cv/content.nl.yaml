profile:
  lead: >-
    Ik ben een freelance data scientist die tien jaar op de vloer van een van Europa's
    drukste containerterminals stond voor ik ooit een model aanraakte — kaaikranen
    bedienen, straddle carriers rijden, live ladingstromen beheren. Ik bouw de data- en
    ML-systemen die de maritieme en terminalwereld echt nodig heeft, vanuit iemand die die
    operatie zelf gedraaid heeft.
  body: >-
    Ik werk op het snijvlak van zware industrie en moderne data-engineering: integratielagen
    voor legacy terminal operating systems, voorspellende modellen voor live
    scheepsoperaties, real-time digital twins en reinforcement learning voor
    containeroptimalisatie. Ik doe niet aan mysterie — je weet wat ik bouw, waarom, en waar
    het staat. Ik stel de ongemakkelijke vragen vroeg, zodat ze later geen dure problemen
    worden. Zoek je iemand die je operatie begrijpt vóór hij je data aanraakt, dan komen we
    goed overeen.

edge:
  label: Het Verschil
  body: >-
    Meer dan tien jaar hands-on ervaring over de volledige operationele hiërarchie van een
    grote containerterminal — havenarbeider, straddle carrier-chauffeur, ship-to-shore
    kraanbestuurder. Ik ken de workflows, de fysieke beperkingen en de faalmodi die in geen
    enkele handleiding staan: ligplaatsplanning, yarddensiteit, het choreograferen van
    machines onder de druk van een vaarschema, en de menselijke factoren die bepalen of een
    ploeg vlot draait. Voor een dataproject betekent dat dat ik het verschil zie tussen een
    cijfer dat juist lijkt en een cijfer dat operationeel klopt — en dat ik het budget van
    een klant niet opbrand aan het verkeerde probleem.

services:
  - name: Operationele ML & Forecasting
    desc: Voorspellende modellen voor de live operatie — lostijden, yardplanning, machinetoewijzing en throughput.
  - name: Systeemintegratie
    desc: Integratielagen die legacy TOS, SCADA en industriële systemen koppelen aan moderne ML-pipelines — zonder het kernsysteem aan te passen.
  - name: Real-Time Digital Twins
    desc: Live dashboards en digital twins die de staat van de terminal leesbaar maken in één samenhangend beeld.
  - name: Data-engineering
    desc: CDC-pipelines, point-in-time reconstructie van data, cloud streaming en analyseklare datafundamenten.
  - name: RL & Simulatie
    desc: Reinforcement learning en simulatieomgevingen op maat voor stuur- en optimalisatieproblemen.
  - name: Advies
    desc: Haalbaarheid, architectuur en "moeten we dit eigenlijk wel bouwen"-reviews voor projecten waar operatie en data samenkomen.

